<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite nicht gefunden – Meine Chili-Welt</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/loader.js" defer></script>
</head>
<body>
    <!-- Skip link: lets keyboard users jump past the navigation -->
    <a class="skip-link" href="#main-content">Zum Inhalt springen</a>

    <!-- Site header with logo and main navigation, content from components/header.html -->
    <header class="site-header" id="site-header"></header>

    <main id="main-content">
        <!-- Error message: text and decorative illustration -->
        <section class="error-page" aria-labelledby="error-heading">
            <div class="error-page__content">
                <p class="error-page__code">Fehler 404</p>
                <h1 id="error-heading">Hier wächst leider nichts!</h1>
                <p class="error-page__text">
                    Diese Seite gibt es nicht (mehr). Vielleicht ist die Adresse falsch oder die Seite
                    wurde verschoben. Mit diesen Links findest du zurück:
                </p>

                <!-- Links styled as buttons: they lead to other pages -->
                <ul class="error-page__actions">
                    <li><a class="button button--primary" href="index.html">Zur Startseite</a></li>
                    <li><a class="button button--secondary" href="growing.html">Zum Anbau-Guide</a></li>
                </ul>
            </div>

            <!-- Decorative seedling: empty alt, as the heading already carries the message -->
            <img class="error-page__image" src="images/404-seedling.svg" alt="" width="320" height="320">
        </section>
    </main>

    <!-- Site footer with page links and legal links, content from components/footer.html -->
    <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
